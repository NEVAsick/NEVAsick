<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 140" width="100%" height="100%">
  <defs>
    <!-- Эффект растекания чернил/мела -->
    <filter id="space-bleed-pure" x="-20" y="-20" width="890" height="180" filterUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.1" numOctaves="3" seed="29" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- 100% ПРОЗРАЧНЫЙ ФОН: ТОЛЬКО КОСМОС -->
  <g filter="url(#space-bleed-pure)">
    <!-- Двойная небрежная орбитальная линия горизонта -->
    <path d="M 15,70 Q 210,57 425,73 T 835,65" fill="none" stroke="#52575B" stroke-width="4.8" stroke-linecap="round" />
    <path d="M 45,76 Q 310,84 790,69" fill="none" stroke="#C4C9CC" stroke-width="2.2" stroke-linecap="round" />

    <!-- ЛЕВАЯ ЧАСТЬ: -->
    <!-- Далекая планета с кольцом (мини-Сатурн) -->
    <g transform="translate(120, 60)">
      <circle cx="0" cy="0" r="6" fill="#1E2022" transform="translate(1, 1)" />
      <ellipse cx="0" cy="0" rx="16" ry="5" fill="none" stroke="#1E2022" stroke-width="3" transform="rotate(-15) translate(1, 1)" />
      <circle cx="0" cy="0" r="6" fill="#0D0E10" stroke="#D8DDE0" stroke-width="1.6" />
      <ellipse cx="0" cy="0" rx="16" ry="5" fill="none" stroke="#D8DDE0" stroke-width="1.6" transform="rotate(-15)" />
    </g>

    <!-- Созвездие слева (Треугольник) -->
    <g transform="translate(195, 45)" stroke-linecap="round">
      <polygon points="0,14 18,0 32,16" fill="none" stroke="#1E2022" stroke-width="3" transform="translate(1, 1)" />
      <polygon points="0,14 18,0 32,16" fill="none" stroke="#C8CDD0" stroke-width="1.6" />
      <circle cx="0" cy="14" r="2.8" fill="#D8DDE0" />
      <circle cx="18" cy="0" r="3.2" fill="#FFFFFF" />
      <circle cx="32" cy="16" r="2.8" fill="#D8DDE0" />
    </g>

    <!-- Пунктирная траектория орбиты спутника вокруг сингулярности -->
    <path d="M 285,92 Q 425,38 565,88" fill="none" stroke="#1E2022" stroke-width="3" stroke-dasharray="4,6" transform="translate(1, 1)" />
    <path d="M 285,92 Q 425,38 565,88" fill="none" stroke="#D8DDE0" stroke-width="1.5" stroke-dasharray="4,6" />

    <!-- Космический зонд («Вояджер»), летящий по орбите слева -->
    <g transform="translate(320, 68) rotate(-18)">
      <rect x="-6" y="-4" width="12" height="8" fill="#1E2022" stroke="#1E2022" stroke-width="2" transform="translate(1, 1)" />
      <rect x="-6" y="-4" width="12" height="8" fill="#0D0E10" stroke="#D8DDE0" stroke-width="1.6" />
      <line x1="-15" y1="0" x2="-6" y2="0" stroke="#D8DDE0" stroke-width="2.5" stroke-linecap="round" />
      <line x1="6" y1="0" x2="15" y2="0" stroke="#D8DDE0" stroke-width="2.5" stroke-linecap="round" />
      <line x1="0" y1="-4" x2="0" y2="-12" stroke="#D8DDE0" stroke-width="1.5" />
      <circle cx="0" cy="-12" r="1.8" fill="#D8DDE0" />
    </g>

    <!-- ЦЕНТР: Чёрная дыра / Сингулярность с аккреционными кольцами и лучами квазара -->
    <g transform="translate(425, 72)">
      <!-- Аккреционный диск: тень -->
      <ellipse cx="0" cy="0" rx="44" ry="15" fill="none" stroke="#1E2022" stroke-width="5" transform="rotate(14)" />
      <ellipse cx="0" cy="0" rx="30" ry="10" fill="none" stroke="#1E2022" stroke-width="3.5" transform="rotate(-25)" />
      <circle cx="0" cy="0" r="15" fill="#1E2022" stroke="#1E2022" stroke-width="3" />

      <!-- Меловые кольца диска -->
      <ellipse cx="0" cy="0" rx="44" ry="15" fill="none" stroke="#D8DDE0" stroke-width="2.4" transform="rotate(14)" />
      <ellipse cx="0" cy="0" rx="30" ry="10" fill="none" stroke="#7E8487" stroke-width="1.4" stroke-dasharray="8,4" transform="rotate(-25)" />

      <!-- Черное ядро сингулярности -->
      <circle cx="0" cy="0" r="11" fill="#0D0E10" stroke="#D8DDE0" stroke-width="2.6" />
      <circle cx="0" cy="0" r="3.2" fill="#FFFFFF" />

      <!-- Вертикальный и горизонтальный луч квазара / прицел -->
      <line x1="0" y1="-32" x2="0" y2="32" stroke="#1E2022" stroke-width="3.5" transform="translate(1, 1)" />
      <line x1="-36" y1="0" x2="36" y2="0" stroke="#1E2022" stroke-width="3.5" transform="translate(1, 1)" />
      <line x1="0" y1="-32" x2="0" y2="32" stroke="#C8CDD0" stroke-width="2" />
      <line x1="-36" y1="0" x2="36" y2="0" stroke="#C8CDD0" stroke-width="2" />

      <!-- Калибровочные риски -->
      <line x1="-3" y1="-20" x2="3" y2="-20" stroke="#C8CDD0" stroke-width="1.5" />
      <line x1="-3" y1="20" x2="3" y2="20" stroke="#C8CDD0" stroke-width="1.5" />
      <line x1="-22" y1="-3" x2="-22" y2="3" stroke="#C8CDD0" stroke-width="1.5" />
      <line x1="22" y1="-3" x2="22" y2="3" stroke="#C8CDD0" stroke-width="1.5" />
    </g>

    <!-- ПРАВАЯ ЧАСТЬ: -->
    <!-- Созвездие справа от черной дыры (W-образная Кассиопея) -->
    <g transform="translate(515, 48)" stroke-linecap="round">
      <path d="M 0,9 L 12,0 L 25,13 L 39,2 L 51,15" fill="none" stroke="#1E2022" stroke-width="3" transform="translate(1, 1)" />
      <path d="M 0,9 L 12,0 L 25,13 L 39,2 L 51,15" fill="none" stroke="#C8CDD0" stroke-width="1.6" />
      <circle cx="0" cy="9" r="2.8" fill="#D8DDE0" />
      <circle cx="12" cy="0" r="2.6" fill="#D8DDE0" />
      <circle cx="25" cy="13" r="3.2" fill="#FFFFFF" />
      <circle cx="39" cy="2" r="2.6" fill="#D8DDE0" />
      <circle cx="51" cy="15" r="3.0" fill="#D8DDE0" />
    </g>

    <!-- Комета / падающая звезда справа -->
    <g transform="translate(685, 42) rotate(25)">
      <line x1="0" y1="0" x2="28" y2="0" stroke="#1E2022" stroke-width="3" stroke-linecap="round" transform="translate(1, 1)" />
      <line x1="0" y1="0" x2="28" y2="0" stroke="#C8CDD0" stroke-width="1.8" stroke-linecap="round" />
      <circle cx="28" cy="0" r="3" fill="#FFFFFF" />
    </g>

    <!-- Одиночные 4-лучевые сияющие звезды -->
    <g transform="translate(65, 52)">
      <path d="M 0,-7 L 0,7 M -7,0 L 7,0" stroke="#1E2022" stroke-width="3" transform="translate(1, 1)" />
      <path d="M 0,-7 L 0,7 M -7,0 L 7,0" stroke="#D8DDE0" stroke-width="1.6" />
    </g>
    <g transform="translate(620, 52)">
      <path d="M 0,-8 L 0,8 M -8,0 L 8,0" stroke="#1E2022" stroke-width="3" transform="translate(1, 1)" />
      <path d="M 0,-8 L 0,8 M -8,0 L 8,0" stroke="#D8DDE0" stroke-width="1.6" />
    </g>
    <g transform="translate(775, 55)">
      <path d="M 0,-7 L 0,7 M -7,0 L 7,0" stroke="#1E2022" stroke-width="3" transform="translate(1, 1)" />
      <path d="M 0,-7 L 0,7 M -7,0 L 7,0" stroke="#D8DDE0" stroke-width="1.6" />
    </g>

    <!-- Точки звездного поля / пыль -->
    <circle cx="160" cy="85" r="2.4" fill="#C4C9CC" />
    <circle cx="260" cy="52" r="3.0" fill="#6E7578" />
    <circle cx="375" cy="98" r="2.0" fill="#C4C9CC" />
    <circle cx="485" cy="95" r="2.2" fill="#6E7578" />
    <circle cx="650" cy="85" r="2.8" fill="#6E7578" />
    <circle cx="730" cy="78" r="2.2" fill="#C4C9CC" />
  </g>
</svg>
