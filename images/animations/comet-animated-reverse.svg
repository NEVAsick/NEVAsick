<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 56 800 80" width="100%" height="100%">
  <defs>
    <!-- Живое дрожание мелового контура (Line Boil) -->
    <filter id="comet-boil" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="3" seed="17" result="noise">
        <animate attributeName="seed" values="17;42;89;63;17" dur="0.36s" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.0" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <style>
      /* Непрерывный пролёт кометы через весь экран */
      @keyframes comet-pass {
        0%   { transform: translate(470px, 0px); }
        80%  { transform: translate(-615px, 0px); }
        100% { transform: translate(-615px, 0px); }
      }

      /* Струящиеся штрихи хвоста */
      @keyframes tail-stream {
        0%   { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -48; }
      }

      /* Пульсация головного ядра-звезды */
      @keyframes head-flare {
        0%, 100% { transform: scale(1) rotate(0deg); }
        50%      { transform: scale(1.22) rotate(12deg); }
      }

      /* Мерцание искр и осколков в хвосте */
      @keyframes spark-twinkle {
        0%, 100% { opacity: 0.9; transform: scale(1); }
        50%      { opacity: 0.2; transform: scale(0.5); }
      }

      .comet-carrier {
        animation: comet-pass 10s infinite linear;
      }

      .stream-line {
        stroke-dasharray: 28 10 14 8;
        animation: tail-stream 0.55s infinite linear;
      }

      .stream-line-fast {
        stroke-dasharray: 18 12 8 10;
        animation: tail-stream 0.38s infinite linear;
      }

      .comet-head-star {
        transform-origin: 0px 0px;
        animation: head-flare 0.8s infinite ease-in-out;
      }

      .spark-1 { transform-origin: 95px 0px; animation: spark-twinkle 0.6s infinite ease-in-out; }
      .spark-2 { transform-origin: 145px -10px; animation: spark-twinkle 0.75s infinite ease-in-out 0.25s; }
      .spark-3 { transform-origin: 185px 9px; animation: spark-twinkle 0.5s infinite ease-in-out 0.4s; }
    </style>
  </defs>

  <!-- 100% ПРОЗРАЧНЫЙ ФОН -->
  <g transform="translate(800 0) scale(-1 1)">
  <g filter="url(#comet-boil)">
    <g class="comet-carrier">
      <!-- Поворот под углом полёта (-3.2 градуса) -->
      <g transform="translate(340, 96) rotate(0)" stroke-linecap="round">

        <!-- ТЁМНАЯ ПОДЛОЖКА (для контраста на светлой теме GitHub) -->
        <g transform="translate(2, 2)" stroke="#1E2022" fill="none" opacity="0.85">
          <path d="M 4,-2 Q 80,-8 195,-26" stroke-width="5.2" />
          <path d="M 6,0 Q 95,0 225,-4" stroke-width="5.5" />
          <path d="M 4,3 Q 80,10 185,22" stroke-width="5.0" />
          <path d="M 15,-6 Q 75,-18 145,-36" stroke-width="4.0" />
          <path d="M 15,6 Q 75,18 135,34" stroke-width="4.0" />
          <circle cx="0" cy="0" r="10" fill="#1E2022" />
          <path d="M 0,-22 Q 0,0 -22,0 Q 0,0 0,22 Q 0,0 22,0 Q 0,0 0,-22 Z" fill="#1E2022" stroke-width="3" />
        </g>

        <!-- ОСНОВНОЙ МЕЛОВОЙ СЛОЙ КОМЕТЫ -->
        <!-- Внешние разреженные перья хвоста -->
        <path d="M 15,-6 Q 75,-18 145,-36" fill="none" stroke="#9EA4A8" stroke-width="1.8" class="stream-line" />
        <path d="M 15,6 Q 75,18 135,34" fill="none" stroke="#9EA4A8" stroke-width="1.8" class="stream-line-fast" />
        <path d="M 45,-3 Q 130,-12 245,-16" fill="none" stroke="#7E8487" stroke-width="1.4" stroke-dasharray="10 14 6 12" />
        <path d="M 40,4 Q 120,12 215,12" fill="none" stroke="#7E8487" stroke-width="1.4" stroke-dasharray="12 10 5 14" />

        <!-- Главные меловые струи хвоста -->
        <path d="M 4,-2 Q 80,-8 195,-26" fill="none" stroke="#D8DDE0" stroke-width="2.8" class="stream-line" />
        <path d="M 6,0 Q 95,0 225,-4" fill="none" stroke="#ECEEEF" stroke-width="3.2" class="stream-line-fast" />
        <path d="M 4,3 Q 80,10 185,22" fill="none" stroke="#D8DDE0" stroke-width="2.6" class="stream-line" />

        <!-- Яркая сердцевина хвоста возле ядра -->
        <path d="M 2,-1 L 85,-7" fill="none" stroke="#FFFFFF" stroke-width="2.6" />
        <path d="M 2,0 L 110,-1" fill="none" stroke="#FFFFFF" stroke-width="3.0" />
        <path d="M 2,2 L 75,7" fill="none" stroke="#FFFFFF" stroke-width="2.4" />

        <!-- Осколки / звёздная пыль в хвосте -->
        <g class="spark-1">
          <path d="M 95,-6 L 95,6 M 89,0 L 101,0" stroke="#FFFFFF" stroke-width="1.6" />
          <circle cx="95" cy="0" r="2" fill="#FFFFFF" />
        </g>
        <g class="spark-2">
          <path d="M 145,-15 L 145,-5 M 140,-10 L 150,-10" stroke="#D8DDE0" stroke-width="1.4" />
          <circle cx="145" cy="-10" r="1.8" fill="#FFFFFF" />
        </g>
        <g class="spark-3">
          <circle cx="185" cy="9" r="2.2" fill="#ECEEEF" />
          <circle cx="162" cy="-2" r="1.6" fill="#D8DDE0" />
          <circle cx="210" cy="-9" r="1.5" fill="#9EA4A8" />
        </g>

        <!-- Дуга ударной волны перед головой кометы -->
        <path d="M -8,-13 C -17,-6 -17,6 -8,13" fill="none" stroke="#D8DDE0" stroke-width="1.8" stroke-dasharray="6 4" />

        <!-- Ядро (голова) кометы со звездой-вспышкой -->
        <circle cx="0" cy="0" r="7.5" fill="#ECEEEF" stroke="#1E2022" stroke-width="1.5" />
        <g class="comet-head-star">
          <path d="M 0,-20 Q 0,0 -20,0 Q 0,0 0,20 Q 0,0 20,0 Q 0,0 0,-20 Z" 
                fill="#FFFFFF" stroke="#ECEEEF" stroke-width="1.2" stroke-linejoin="round" />
          <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
        </g>

      </g>
    </g>
  </g>
  </g>
</svg>
