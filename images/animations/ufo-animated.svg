<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="100%" height="100%">
  <defs>
    <!-- Живое дрожание мелового контура (Line Boil) -->
    <filter id="ufo-boil" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="3" seed="23" result="noise">
        <animate attributeName="seed" values="23;51;84;37;23" dur="0.4s" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <style>
      /* Плавный пролёт НЛО через экран */
      @keyframes ufo-flight {
        0%   { transform: translate(0px, 0px); opacity: 1; }
        42%  { transform: translate(-360px, 35px); opacity: 1; }
        49%  { transform: translate(-430px, 45px); opacity: 0; }
        50%  { transform: translate(430px, -45px); opacity: 0; }
        58%  { transform: translate(360px, -35px); opacity: 1; }
        100% { transform: translate(0px, 0px); opacity: 1; }
      }

      /* Плавное парение НЛО в невесомости */
      @keyframes ufo-hover {
        0%, 100% { transform: translateY(0px) rotate(-3deg); }
        50%      { transform: translateY(-7px) rotate(3deg); }
      }

      /* Пульсация / мерцание луча захвата */
      @keyframes beam-pulse {
        0%, 100% { opacity: 0.65; transform: scaleX(1); }
        50%      { opacity: 0.25; transform: scaleX(0.85); }
      }

      /* Мигание иллюминаторов на тарелке */
      @keyframes window-blink-1 {
        0%, 100% { fill: #FFFFFF; }
        50%      { fill: #7E8487; }
      }
      @keyframes window-blink-2 {
        0%, 100% { fill: #7E8487; }
        50%      { fill: #FFFFFF; }
      }

      .ufo-carrier {
        animation: ufo-flight 5.8s infinite linear;
      }
      .ufo-body {
        transform-origin: 0px -10px;
        animation: ufo-hover 2.6s infinite ease-in-out;
      }
      .tractor-beam {
        transform-origin: 0px -15px;
        animation: beam-pulse 1.4s infinite ease-in-out;
      }
      .w-1 { animation: window-blink-1 0.9s infinite; }
      .w-2 { animation: window-blink-2 0.9s infinite; }
    </style>
  </defs>

  <!-- 100% ПРОЗРАЧНЫЙ ФОН -->
  <g filter="url(#ufo-boil)">
    <g class="ufo-carrier">
      <g transform="translate(400, 90)">
        
        <!-- ТЁМНАЯ ПОДЛОЖКА (для контраста на светлой теме GitHub) -->
        <g transform="translate(2, 2)" stroke="#1E2022" fill="none" opacity="0.85">
          <polygon points="0,15 -35,55 35,55" fill="#1E2022" stroke-width="3" />
          <ellipse cx="0" cy="55" rx="38" ry="12" fill="#1E2022" stroke-width="3" />
          <ellipse cx="0" cy="-12" rx="22" ry="11" fill="#1E2022" stroke-width="3" />
          <ellipse cx="0" cy="-2" rx="55" ry="14" fill="#1E2022" stroke-width="3" />
          <line x1="0" y1="-23" x2="0" y2="-34" stroke-width="4" />
          <circle cx="0" cy="-34" r="3" fill="#1E2022" stroke-width="2" />
        </g>

        <!-- ПУЛЬСИРУЮЩИЙ ЛУЧ ЗАХВАТА КНИЗУ -->
        <g class="tractor-beam" stroke-linecap="round">
          <polygon points="0,15 -38,55 38,55" fill="#D8DDE0" opacity="0.18" />
          <polygon points="0,15 -22,55 22,55" fill="#FFFFFF" opacity="0.25" />
          <line x1="0" y1="15" x2="-38" y2="55" stroke="#D8DDE0" stroke-width="2" stroke-dasharray="8 6" />
          <line x1="0" y1="15" x2="38" y2="55" stroke="#D8DDE0" stroke-width="2" stroke-dasharray="8 6" />
          <line x1="0" y1="20" x2="-22" y2="55" stroke="#ECEEEF" stroke-width="1.5" />
          <line x1="0" y1="20" x2="22" y2="55" stroke="#ECEEEF" stroke-width="1.5" />
          <ellipse cx="0" cy="32" rx="14" ry="5" fill="none" stroke="#ECEEEF" stroke-width="1.5" stroke-dasharray="4 4" />
          <ellipse cx="0" cy="46" rx="26" ry="8" fill="none" stroke="#ECEEEF" stroke-width="1.6" stroke-dasharray="6 4" />
        </g>

        <!-- КОРПУС НЛО -->
        <g class="ufo-body" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="0" cy="5" rx="52" ry="13" fill="#0D0E10" stroke="#ECEEEF" stroke-width="2.6" />
          <path d="M -40,8 Q 0,16 40,8" fill="none" stroke="#9EA4A8" stroke-width="1.8" />

          <ellipse cx="0" cy="-2" rx="58" ry="14" fill="#0D0E10" stroke="#ECEEEF" stroke-width="2.8" />
          <path d="M -50,-1 Q 0,7 50,-1 M -45,-5 Q 0,3 45,-5" fill="none" stroke="#D8DDE0" stroke-width="1.8" />

          <!-- Окна / огни -->
          <circle cx="-32" cy="-1" r="3" class="w-1" stroke="#1E2022" stroke-width="1.2" />
          <circle cx="-16" cy="2" r="3" class="w-2" stroke="#1E2022" stroke-width="1.2" />
          <circle cx="0" cy="3" r="3.2" class="w-1" stroke="#1E2022" stroke-width="1.2" />
          <circle cx="16" cy="2" r="3" class="w-2" stroke="#1E2022" stroke-width="1.2" />
          <circle cx="32" cy="-1" r="3" class="w-1" stroke="#1E2022" stroke-width="1.2" />

          <!-- Купол кабины -->
          <ellipse cx="0" cy="-12" rx="24" ry="12" fill="#0D0E10" stroke="#ECEEEF" stroke-width="2.4" />
          <path d="M -14,-15 C -4,-19 4,-19 14,-15" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />

          <!-- Антенна -->
          <line x1="0" y1="-24" x2="0" y2="-36" stroke="#ECEEEF" stroke-width="2.2" />
          <circle cx="0" cy="-36" r="3.2" fill="#FFFFFF" class="w-1" stroke="#1E2022" stroke-width="1" />
        </g>

      </g>
    </g>
  </g>
</svg>
