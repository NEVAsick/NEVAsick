<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="100%" height="100%">
  <defs>
    <!-- Живое дрожание мелового контура (Line Boil) -->
    <filter id="sputnik-boil" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="3" seed="14" result="noise">
        <animate attributeName="seed" values="14;39;72;51;14" dur="0.4s" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <style>
      /* Плавный пролёт спутника через экран слева направо */
      @keyframes sputnik-flight {
        0%   { transform: translate(0px, 0px); opacity: 1; }
        42%  { transform: translate(360px, -42px); opacity: 1; }
        49%  { transform: translate(430px, -50px); opacity: 0; }
        50%  { transform: translate(-430px, 50px); opacity: 0; }
        58%  { transform: translate(-360px, 42px); opacity: 1; }
        100% { transform: translate(0px, 0px); opacity: 1; }
      }

      /* Покачивание корпуса в невесомости */
      @keyframes body-wobble {
        0%, 100% { transform: rotate(-6deg); }
        50%      { transform: rotate(-1deg); }
      }

      /* Бегущий пунктирный след позади спутника */
      @keyframes trail-flow {
        0%   { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 36; }
      }

      /* Расходящиеся радиоволны сигнала ))) */
      @keyframes wave-ping-1 {
        0%, 100% { opacity: 0.95; transform: scale(1); }
        50%      { opacity: 0.2; transform: scale(0.85); }
      }
      @keyframes wave-ping-2 {
        0%, 100% { opacity: 0.2; transform: scale(0.9); }
        50%      { opacity: 0.95; transform: scale(1.08); }
      }

      .sputnik-carrier {
        animation: sputnik-flight 5.5s infinite linear;
      }
      .sputnik-body {
        animation: body-wobble 2.2s infinite ease-in-out;
      }
      .orbit-trail {
        stroke-dasharray: 10 8;
        animation: trail-flow 0.6s infinite linear;
      }
      .ping-1 { transform-origin: 24px 0px; animation: wave-ping-1 1.1s infinite ease-in-out; }
      .ping-2 { transform-origin: 34px 0px; animation: wave-ping-2 1.1s infinite ease-in-out; }
    </style>
  </defs>

  <!-- 100% ПРОЗРАЧНЫЙ ФОН: ТОЛЬКО ПРОЛЕТАЮЩИЙ СПУТНИК -->
  <g filter="url(#sputnik-boil)">
    <g class="sputnik-carrier">
      <g transform="translate(380, 95)">
        <g class="sputnik-body" stroke-linecap="round" stroke-linejoin="round">

          <!-- ТЁМНАЯ ПОДЛОЖКА (для контраста на светлой теме GitHub) -->
          <g transform="translate(2, 2)" stroke="#1E2022" fill="none" opacity="0.85">
            <path d="M -30,4 Q -110,12 -195,26" stroke-width="4.5" stroke-dasharray="10 8" />
            <line x1="-10" y1="-8" x2="-78" y2="-22" stroke-width="4.5" />
            <line x1="-14" y1="-2" x2="-92" y2="2" stroke-width="4.5" />
            <line x1="-12" y1="5" x2="-84" y2="24" stroke-width="4.5" />
            <line x1="-8" y1="10" x2="-64" y2="38" stroke-width="4.2" />
            <circle cx="0" cy="0" r="16" fill="#1E2022" stroke-width="4" />
            <path d="M 24,-9 C 29,-4 29,4 24,9 M 33,-15 C 40,-7 40,7 33,15 M 42,-21 C 51,-10 51,10 42,21" stroke-width="4.2" />
          </g>

          <!-- Пунктирный орбитальный след позади -->
          <path d="M -30,4 Q -110,12 -195,26" fill="none" stroke="#9EA4A8" stroke-width="2" class="orbit-trail" />

          <!-- 4 длинных усика-антенны спутника -->
          <line x1="-10" y1="-8" x2="-78" y2="-22" stroke="#D8DDE0" stroke-width="2.2" />
          <line x1="-14" y1="-2" x2="-92" y2="2" stroke="#ECEEEF" stroke-width="2.4" />
          <line x1="-12" y1="5" x2="-84" y2="24" stroke="#D8DDE0" stroke-width="2.2" />
          <line x1="-8" y1="10" x2="-64" y2="38" stroke="#9EA4A8" stroke-width="1.8" />

          <!-- Сферический корпус спутника с меловой штриховкой -->
          <circle cx="0" cy="0" r="16" fill="#0D0E10" stroke="#ECEEEF" stroke-width="2.6" />
          <path d="M -15,-4 Q 0,5 15,-4" fill="none" stroke="#D8DDE0" stroke-width="1.8" />
          <path d="M -11,5 L -4,13 M -6,4 L 2,14 M 0,3 L 8,12 M 6,2 L 12,8" stroke="#9EA4A8" stroke-width="1.8" />
          <circle cx="-5" cy="-7" r="2.6" fill="#FFFFFF" />
          <circle cx="6" cy="-5" r="1.5" fill="#D8DDE0" />

          <!-- Пульсирующие радиоволны сигнала спереди ))) -->
          <g class="ping-1" fill="none" stroke="#FFFFFF" stroke-width="2.4">
            <path d="M 24,-9 C 29,-4 29,4 24,9" />
          </g>
          <g class="ping-2" fill="none" stroke="#D8DDE0" stroke-width="2.0">
            <path d="M 33,-15 C 40,-7 40,7 33,15" />
            <path d="M 42,-21 C 51,-10 51,10 42,21" stroke="#9EA4A8" stroke-width="1.6" />
          </g>

        </g>
      </g>
    </g>
  </g>
</svg>
