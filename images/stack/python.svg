<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Гранж-фильтр неровного мелового контура с живым мерцанием (Line Boil) -->
    <filter id="grunge-ink" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="3" seed="11" result="noise">
        <animate attributeName="seed" values="11;27;43;68;11" dur="0.45s" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <!-- Статичный гранж-фильтр для внешней рамки -->
    <filter id="card-grunge" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="3" seed="7" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <style>
      /* Плавное перекатывание логотипа как в оригинальной гифке */
      @keyframes py-roll {
        0%, 100% { transform: translate(-8px, -4px) rotate(-42deg); }
        25% { transform: translate(0px, 4px) rotate(0deg); }
        50% { transform: translate(8px, -4px) rotate(42deg); }
        75% { transform: translate(0px, 4px) rotate(0deg); }
      }

      /* Поочерёдное подмигивание глаз */
      @keyframes eye-pulse {
        0%, 44%, 56%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.35); opacity: 0.25; }
      }

      .py-spinner {
        transform-origin: 60px 60px;
        animation: py-roll 3.6s infinite ease-in-out;
      }

      .eye-1 {
        transform-origin: 38.9px 28.4px;
        animation: eye-pulse 3.6s infinite ease-in-out;
      }
      .eye-2 {
        transform-origin: 61.1px 71.6px;
        animation: eye-pulse 3.6s infinite ease-in-out 1.8s;
      }
    </style>
  </defs>

  <!-- Тёмная гранжевая карточка -->
  <rect x="4" y="4" width="112" height="112" rx="10" fill="#0D0E10" stroke="#52575B" stroke-width="2.8" filter="url(#card-grunge)" />

  <!-- Мелкие гранжевые точки и царапины на фоне -->
  <g fill="#52575B" opacity="0.55" filter="url(#card-grunge)">
    <circle cx="20" cy="96" r="1.4" />
    <circle cx="98" cy="24" r="1.2" />
    <path d="M 88,98 L 96,95" stroke="#52575B" stroke-width="1.2" stroke-linecap="round" />
    <path d="M 18,26 L 24,22" stroke="#52575B" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Анимированный логотип Python по центру (60, 60) -->
  <g class="py-spinner" filter="url(#grunge-ink)">
    <g transform="translate(10, 10)">
      <!-- Тень под змейками для объёма -->
