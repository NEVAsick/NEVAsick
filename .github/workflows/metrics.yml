name: GitHub Metrics
on:
  schedule:
    - cron: "0 */12 * * *" 
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest 
        with:
          token: ${{ secrets.GITHUB_TOKEN }} 
          user: NEVAsick

          template: classic
          theme: github-dark

          base: header, activity, community, repositories 

          plugin_streak: yes 
          plugin_languages: yes 
          plugin_isocalendar: yes 
          plugin_followup: yes 
