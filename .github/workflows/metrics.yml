name: GitHub Metrics
on:
  schedule:
    - cron: "0 */12 * * *"  # 
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:

          token: ${{ secrets.GITHUB_TOKEN }}
          user: NEVAsick 
          template: classic
          base: ""
          
          theme: solarized
          plugin_introduction: yes
          plugin_introduction_title: "⚡ GitHub Activity"
          plugin_introduction_title_animation: true
          config_display: large
          config_border: yes
          config_border_radius: 12
          config_animation: true
          config_timezone: Europe/Moscow 
          
          
          plugin_languages: yes
          plugin_languages_analysis_timeout: 30
          plugin_languages_categories: programming, markup, data
          plugin_languages_colors: solarized
          plugin_languages_details: percentage, bytes-size
          plugin_languages_indepth: yes
          plugin_languages_limit: 12
          plugin_languages_threshold: 0%
          plugin_languages_ignored: html, css, dockerfile, makefile, tex, json, yaml
          plugin_languages_recent: yes
          plugin_languages_recent_days: 7
          plugin_languages_recent_load: 500
          plugin_languages_recent_categories: programming
          
          
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          plugin_streak: yes
          plugin_streak_days: 365
          plugin_streak_calendar: yes
          
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: stacked
          plugin_habits_days: 90
          plugin_habits_facts: yes
          plugin_habits_from: 100
          plugin_habits_languages: yes
          plugin_habits_languages_limit: 6
          
          
          plugin_lines: yes
          plugin_lines_history_limit: 2000
          plugin_lines_repositories_limit: 100
          plugin_lines_sections: base, changes
          
          plugin_followup: yes
          plugin_followup_archived: yes
          plugin_followup_sections: repositories, starred
          plugin_followup_interval: 1 month
          
          plugin_topics: yes
          plugin_topics_limit: 15
          plugin_topics_sort: stars
          plugin_topics_mode: mirrored
          
          plugin_starlists: yes
          plugin_starlists_limit: 8
          
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: detailed
          
          filename: github-metrics.svg
          output: file